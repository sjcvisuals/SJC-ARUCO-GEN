<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SJC ARUCO GEN</title>
  <style>
    :root {
      --bg: #101114;
      --panel: #1a1c21;
      --line: #2c2f38;
      --text: #ecece8;
      --muted: #8d9099;
      --accent: #d4d0c8;
      --field: #121318;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.08em;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
    }
    aside {
      padding: 20px 24px 28px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    input, select {
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      color-scheme: dark;
    }
    input:focus, select:focus {
      outline: 2px solid #5a5d68;
      outline-offset: 1px;
    }
    input[type="range"] {
      accent-color: #b9b6ae;
      padding: 10px 0;
    }
    .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
    .times { color: var(--muted); padding-bottom: 10px; }
    .grey-row { display: grid; grid-template-columns: 1fr 64px; gap: 8px; align-items: center; }
    .swatch {
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #808080;
    }
    .stats {
      margin-top: 4px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.6;
    }
    .stats strong { color: var(--text); font-weight: 600; }
    button {
      margin-top: auto;
      background: var(--accent);
      color: #161616;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font: 650 14px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: #e58b8b; font-size: 13px; min-height: 1.2em; }
    main {
      min-width: 0;
      padding: 24px;
      display: grid;
      place-items: start center;
      background:
        radial-gradient(circle at 50% 0%, #22242c 0%, var(--bg) 55%);
    }
    .stage {
      width: min(100%, 1100px);
      display: grid;
      gap: 10px;
    }
    .stage span { color: var(--muted); font-size: 12px; }
    canvas {
      width: 100%;
      height: auto;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 10px;
      image-rendering: pixelated;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>SJC ARUCO GEN</h1>
    <p>Open this file in a browser. Choose how many markers and the canvas size, then download a PNG. Nothing to install.</p>
  </header>
  <div class="app">
    <aside>
      <label>Markers
        <input id="count" type="number" min="1" max="1000" value="64">
      </label>
      <div class="row">
        <label>Width
          <input id="width" type="number" min="32" value="5632">
        </label>
        <span class="times">×</span>
        <label>Height
          <input id="height" type="number" min="32" value="1408">
        </label>
      </div>
      <label>Dictionary
        <select id="dict">
          <option value="4x4" selected>4×4 (OpenCV DICT_4X4_1000)</option>
          <option value="5x5">5×5 (OpenCV DICT_5X5_1000)</option>
          <option value="6x6">6×6 (OpenCV DICT_6X6_1000)</option>
        </select>
      </label>
      <label>Grey (0–255)
        <div class="grey-row">
          <input id="grey" type="range" min="0" max="255" value="128">
          <input id="greyNum" type="number" min="0" max="255" value="128">
        </div>
        <div class="swatch" id="swatch"></div>
      </label>
      <div class="stats" id="stats">Set a count and canvas size.</div>
      <div class="err" id="err"></div>
      <button id="download" type="button">Download PNG</button>
    </aside>
    <main>
      <div class="stage">
        <span>Preview</span>
        <canvas id="sheet" width="5632" height="1408"></canvas>
      </div>
    </main>
  </div>

    function num(el, fallback) {
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }

    function bestGrid(n, width, height) {
      let best = Infinity, bestCols = n, bestRows = 1;
      for (let rows = 1; rows <= n; rows++) {
        const cols = Math.ceil(n / rows);
        const cellW = width / cols, cellH = height / rows;
        if (cellW < 8 || cellH < 8) continue;
        const squareness = Math.max(cellW, cellH) / Math.min(cellW, cellH);
        const unused = cols * rows - n;
        const score = squareness + unused * 0.05;
        if (score < best) {
          best = score;
          bestCols = cols;
          bestRows = rows;
        }
      }
      return { cols: bestCols, rows: bestRows };
    }

    function unpackBits(dict, id, markerSize, nbytes) {
      const bits = [];
      const offset = id * nbytes;
      let i = 0;
      for (let row = 0; row < markerSize; row++) {
        bits[row] = [];
        for (let col = 0; col < markerSize; col++) {
          const b = dict[offset + (i >> 3)];
          bits[row][col] = (b & (1 << (7 - (i & 7)))) !== 0;
          i++;
        }
      }
      return bits;
    }

      const cellW = Math.floor(width / cols);
      const cellH = Math.floor(height / rows);
      const originX = Math.floor((width - cellW * cols) / 2);
      const originY = Math.floor((height - cellH * rows) / 2);
      const bits = info.bits;
      const modules = bits + 2;
      const maxSide = Math.min(cellW, cellH);
      const gap = Math.max(4, Math.floor(maxSide / 16));
      let modulePx = Math.max(1, Math.floor((maxSide - 2 * gap) / modules));
      let markerPx = modulePx * modules;
      if (markerPx > maxSide) {
        modulePx = Math.max(1, Math.floor(maxSide / modules));
        markerPx = modulePx * modules;
      }
      return { count, width, height, grey, dictName, info, cols, rows, cellW, cellH, originX, originY, bits, modules, modulePx, markerPx };
    }

    function draw() {
      els.err.textContent = "";
      let opt;
      try { opt = layout(); }
      catch (e) {
        els.err.textContent = e.message;
        els.download.disabled = true;
        return;
      }
      els.download.disabled = false;
      els.swatch.style.background = `rgb(${opt.grey}, ${opt.grey}, ${opt.grey})`;
      els.stats.innerHTML =
        `<strong>${opt.count}</strong> ${opt.dictName} markers<br>` +
        `canvas <strong>${opt.width}×${opt.height}</strong><br>` +
        `grid <strong>${opt.cols}×${opt.rows}</strong> · cell ${opt.cellW}×${opt.cellH} · marker ${opt.markerPx}px`;

      const canvas = els.sheet;
      canvas.width = opt.width;
      canvas.height = opt.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, opt.width, opt.height);
      ctx.fillStyle = `rgb(${opt.grey},${opt.grey},${opt.grey})`;

      const dict = DICTS[opt.dictName];
      const lastRowCount = opt.count - (opt.rows - 1) * opt.cols;
      for (let id = 0; id < opt.count; id++) {
        const row = Math.floor(id / opt.cols);
        const col = id % opt.cols;
        const rowCount = row === opt.rows - 1 ? lastRowCount : opt.cols;
        const rowPadX = Math.floor((opt.cols - rowCount) * opt.cellW / 2);
        const x0 = opt.originX + rowPadX + col * opt.cellW + Math.floor((opt.cellW - opt.markerPx) / 2);
        const y0 = opt.originY + row * opt.cellH + Math.floor((opt.cellH - opt.markerPx) / 2);
        const inner = unpackBits(dict, id, opt.bits, opt.info.nbytes);
        for (let my = 0; my < opt.modules; my++) {
          for (let mx = 0; mx < opt.modules; mx++) {
            const iy = my - 1, ix = mx - 1;
            const on = iy >= 0 && iy < opt.bits && ix >= 0 && ix < opt.bits && inner[iy][ix];
            if (!on) continue;
            ctx.fillRect(x0 + mx * opt.modulePx, y0 + my * opt.modulePx, opt.modulePx, opt.modulePx);
          }
        }
      }
    }

    function syncGrey(from) {
      const v = Math.max(0, Math.min(255, Math.round(num(from, 128))));
      els.grey.value = v;
      els.greyNum.value = v;
      draw();
    }

    ["count", "width", "height", "dict"].forEach(id => {
      els[id].addEventListener("input", draw);
      els[id].addEventListener("change", draw);
    });
    els.grey.addEventListener("input", () => syncGrey(els.grey));
    els.greyNum.addEventListener("input", () => syncGrey(els.greyNum));
    els.download.addEventListener("click", () => {
      try {
        const opt = layout();
        canvasToPng(els.sheet, `aruco_${opt.count}_${opt.width}x${opt.height}.png`);
      } catch (e) {
        els.err.textContent = e.message;
      }
    });

    function canvasToPng(canvas, filename) {
      if (canvas.toBlob) {
        canvas.toBlob(blob => {
          if (!blob) { fallbackDownload(canvas, filename); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
        return;
      }
      fallbackDownload(canvas, filename);
    }

    function fallbackDownload(canvas, filename) {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = filename;
      a.click();
    }

    draw();
  </script>
</body>
</html>
