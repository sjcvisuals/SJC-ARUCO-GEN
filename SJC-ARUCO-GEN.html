<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARUCOGEN</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: #14161a;
      --line: #2a2e36;
      --text: #f2efe8;
      --muted: #9a9ea8;
      --accent: #e8e2d2;
      --field: #0c0d10;
      --mark: #7d818a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #12141a 0%, var(--bg) 28%),
        repeating-conic-gradient(#14161a 0% 25%, #0b0c0e 0% 50%) 0 0 / 28px 28px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 12, 14, 0.92);
      backdrop-filter: blur(8px);
    }
    .mark {
      width: 28px; height: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      flex: none;
    }
    .mark i { background: var(--accent); display: block; }
    .mark i:nth-child(2), .mark i:nth-child(3) { background: #3a3d46; }
    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 0;
    }
    aside {
      padding: 18px 20px 22px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .group {
      display: grid;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .group:last-of-type { border-bottom: 0; padding-bottom: 0; }
    .group h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--mark);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    input, select {
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      color-scheme: dark;
    }
    input:focus, select:focus {
      outline: 2px solid #5c616c;
      outline-offset: 1px;
    }
    input[type="range"] { accent-color: var(--accent); padding: 10px 0; }
    input[type="color"] {
      padding: 4px;
      height: 42px;
      width: 56px;
      cursor: pointer;
    }
    .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
    .times { color: var(--muted); padding-bottom: 10px; }
    .color-row, .grey-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
    .grey-row { grid-template-columns: 1fr 72px; }
    .hex { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.04em; }
    .linkish {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 10px;
      font: 650 11px/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .linkish:hover { color: var(--text); border-color: #4a4f5a; }
    .swatch {
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #808080;
    }
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .seg button {
      margin: 0;
      background: var(--field);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: 650 13px/1 "Segoe UI", system-ui, sans-serif;
    }
    .seg.tight { grid-template-columns: 1fr 1fr; }
    .hidden { display: none !important; }
    .hint { color: var(--muted); font-size: 12px; letter-spacing: 0; text-transform: none; }
    .filter { padding: 8px 12px; }
    .stats {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      background: var(--field);
    }
    .stats strong { color: var(--text); font-weight: 600; }
    .go {
      margin-top: auto;
      background: var(--accent);
      color: #161616;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font: 700 14px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .go:hover { filter: brightness(1.06); }
    .go:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: #e58b8b; font-size: 13px; min-height: 1.2em; }
    main {
      min-width: 0;
      padding: 28px;
      display: grid;
      place-items: start center;
    }
    .stage { width: min(100%, 1120px); }
    .frame {
      position: relative;
      padding: 18px;
    }
    .frame > i {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .frame::before, .frame::after,
    .frame i::before, .frame i::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid #6a6e78;
    }
    .frame::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .frame::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .frame i::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .frame i::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
    .caption {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 0 18px;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #000;
      image-rendering: pixelated;
      display: block;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>ARUCOGEN</h1>
      <p>Pick a count, a canvas, or an LED wall. Download a PNG or JPG.</p>
    </div>
  </header>
  <div class="app">
    <aside>
      <div class="group">
        <h2>Sheet</h2>
        <div>
          <div class="hint" style="margin-bottom:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Markers</div>
          <div class="seg" id="countMode" role="group" aria-label="Marker count mode">
            <button type="button" data-count-mode="density" class="on">Per m²</button>
            <button type="button" data-count-mode="custom">Custom</button>
          </div>
        </div>
        <label id="densityWrap">Per square metre
          <input id="density" type="number" min="0.1" max="100" step="0.1" value="4">
        </label>
        <label id="countWrap" class="hidden">Marker count
          <input id="count" type="number" min="1" max="1000" value="64">
        </label>
        <div>
          <div class="hint" style="margin-bottom:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Size</div>
          <div class="seg" id="sizeMode" role="group" aria-label="Size mode">
            <button type="button" data-size-mode="resolution">Resolution</button>
            <button type="button" data-size-mode="led" class="on">LED wall</button>
          </div>
        </div>
        <div id="resWrap" class="hidden">
          <div class="row">
            <label>Width
              <input id="width" type="number" min="32" value="3840">
            </label>
            <span class="times">×</span>
            <label>Height
              <input id="height" type="number" min="32" value="2160">
            </label>
          </div>
          <label>Pixel pitch (mm)
            <input id="pitch" type="number" min="0" step="0.01" placeholder="Needed for per m²">
          </label>
        </div>
        <div id="ledWrap">
          <label>Panel
            <input id="panelFilter" class="filter" type="search" placeholder="Filter panels">
            <select id="panel"></select>
          </label>
          <div class="row">
            <label>Cabinets across
              <input id="ledCols" type="number" min="1" max="200" value="8">
            </label>
            <span class="times">×</span>
            <label>Cabinets high
              <input id="ledRows" type="number" min="1" max="200" value="4">
            </label>
          </div>
          <div class="hint">Absen, Aluvision, Gloshine, ROE, Unilumin, plus generic pitches.</div>
        </div>
        <label>Dictionary
          <select id="dict">
            <option value="4x4" selected>4×4 (OpenCV DICT_4X4_1000)</option>
            <option value="5x5">5×5 (OpenCV DICT_5X5_1000)</option>
            <option value="6x6">6×6 (OpenCV DICT_6X6_1000)</option>
          </select>
        </label>
      </div>
      <div class="group">
        <h2>Ink</h2>
        <label>Background
          <div class="color-row">
            <input id="bg" type="color" value="#000000" title="Background color">
            <input id="bgHex" class="hex" type="text" value="#000000" maxlength="7" spellcheck="false">
            <button class="linkish" id="bgReset" type="button">Black</button>
          </div>
        </label>
        <label>Marker grey
          <div class="grey-row">
            <input id="grey" type="range" min="0" max="255" value="128">
            <input id="greyNum" type="number" min="0" max="255" value="128">
          </div>
          <div class="swatch" id="swatch"></div>
        </label>
      </div>
      <div class="group">
        <h2>Export</h2>
        <div>
          <div style="font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">File type</div>
          <div class="seg" id="fmt" role="group" aria-label="File type">
            <button type="button" data-fmt="png" class="on">PNG</button>
            <button type="button" data-fmt="jpg">JPG</button>
          </div>
        </div>
      </div>
      <div class="stats" id="stats">Set a count and canvas size.</div>
      <div class="err" id="err"></div>
      <button class="go" id="download" type="button">Download PNG</button>
    </aside>
    <main>
      <div class="stage">
        <div class="caption"><span>Preview</span><span id="captionSize">3840 × 2160</span></div>
        <div class="frame"><i></i>
          <canvas id="sheet" width="3840" height="2160"></canvas>
        </div>
      </div>
    </main>
  </div>
  <script src="panels.js"></script>

    const els = {

    let fileFmt = "png";
    let countMode = "density";
    let sizeMode = "led";

    function fillPanelSelect() {
      const panels = window.LED_PANELS || [];
      const byMan = new Map();
      for (const p of panels) {
        if (!byMan.has(p.manufacturer)) byMan.set(p.manufacturer, []);
        byMan.get(p.manufacturer).push(p);
      }
      els.panel.innerHTML = "";
      for (const [man, list] of byMan) {
        const group = document.createElement("optgroup");
        group.label = man;
        for (const p of list) {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = p.label.replace(`${man} — `, "");
          group.appendChild(opt);
        }
        els.panel.appendChild(group);
      }
      const preferred = panels.find(p => p.id === "generic-p26-500x500") || panels[0];
      if (preferred) els.panel.value = preferred.id;
    }

    function currentPanel() {
      const panels = window.LED_PANELS || [];
      return panels.find(p => p.id === els.panel.value);
    }

    function syncModes() {
      els.densityWrap.classList.toggle("hidden", countMode !== "density");
      els.countWrap.classList.toggle("hidden", countMode !== "custom");
      els.ledWrap.classList.toggle("hidden", sizeMode !== "led");
      els.resWrap.classList.toggle("hidden", sizeMode !== "resolution");
    }

    function sheetSize() {
      if (sizeMode === "led") {
        const p = currentPanel();
        if (!p) throw new Error("Pick an LED panel.");
        const ledCols = Math.round(num(els.ledCols, 0));
        const ledRows = Math.round(num(els.ledRows, 0));
        if (ledCols < 1 || ledRows < 1) throw new Error("Need at least 1 cabinet across and high.");
        return {
          width: p.pixelsX * ledCols,
          height: p.pixelsY * ledRows,
          widthM: (p.widthMm * ledCols) / 1000,
          heightM: (p.heightMm * ledRows) / 1000,
          panel: p,
          ledCols,
          ledRows
        };
      }
      const width = Math.round(num(els.width, 0));
      const height = Math.round(num(els.height, 0));
      const pitch = num(els.pitch, 0);
      const hasPitch = pitch > 0;
      return {
        width,
        height,
        widthM: hasPitch ? width * pitch / 1000 : null,
        heightM: hasPitch ? height * pitch / 1000 : null,
        pitch: hasPitch ? pitch : null
      };
    }

    function num(el, fallback) {
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }

    function bestGrid(n, width, height) {
      let best = Infinity, bestCols = n, bestRows = 1;
      for (let rows = 1; rows <= n; rows++) {
        const cols = Math.ceil(n / rows);
        const cellW = width / cols, cellH = height / rows;
        if (cellW < 8 || cellH < 8) continue;
        const squareness = Math.max(cellW, cellH) / Math.min(cellW, cellH);
        const unused = cols * rows - n;
        const score = squareness + unused * 0.05;
        if (score < best) {
          best = score;
          bestCols = cols;
          bestRows = rows;
        }
      }
      return { cols: bestCols, rows: bestRows };
    }

    function unpackBits(dict, id, markerSize, nbytes) {
      const bits = [];
      const offset = id * nbytes;
      let i = 0;
      for (let row = 0; row < markerSize; row++) {
        bits[row] = [];
        for (let col = 0; col < markerSize; col++) {
          const b = dict[offset + (i >> 3)];
          bits[row][col] = (b & (1 << (7 - (i & 7)))) !== 0;
          i++;
        }
      }
      return bits;
    }

    function parseHex(raw) {
      let s = String(raw || "").trim();
      if (!s.startsWith("#")) s = "#" + s;
      if (/^#[0-9a-f]{3}$/i.test(s)) {
        s = "#" + [...s.slice(1)].map(c => c + c).join("");
      }
      if (!/^#[0-9a-f]{6}$/i.test(s)) throw new Error("Background color should look like #000000.");
      return s.toLowerCase();
    }

    function layout() {
      const size = sheetSize();
      const width = size.width;
      const height = size.height;
      let count;
      let density = null;
      if (countMode === "density") {
        density = num(els.density, 4);
        if (!(density > 0)) throw new Error("Markers per m² must be greater than 0.");
        if (size.widthM == null || size.heightM == null) {
          throw new Error("Per m² needs an LED wall, or a pixel pitch with the resolution.");
        }
        count = Math.max(1, Math.round(density * size.widthM * size.heightM));
      } else {
        count = Math.round(num(els.count, 0));
      }
      const grey = Math.round(num(els.grey, 128));
      const bg = parseHex(els.bgHex.value || els.bg.value);
      const dictName = els.dict.value;
      const info = DICT_INFO[dictName];
      if (!(count >= 1 && count <= 1000)) {
        throw new Error(count > 1000
          ? "That wall wants more than 1000 markers. Lower the density or use a custom count."
          : "Need at least 1 marker.");
      }
      if (!(width >= 32 && height >= 32)) throw new Error("Canvas should be at least 32×32.");
      if (width * height > 40_000_000) throw new Error("Canvas is too large for the browser. Try fewer cabinets.");
      const { cols, rows } = bestGrid(count, width, height);
      const cellW = Math.floor(width / cols);
      const cellH = Math.floor(height / rows);
      const originX = Math.floor((width - cellW * cols) / 2);
      const originY = Math.floor((height - cellH * rows) / 2);
      const bits = info.bits;
      const modules = bits + 2;
      const maxSide = Math.min(cellW, cellH);
      const gap = Math.max(4, Math.floor(maxSide / 16));
      let modulePx = Math.max(1, Math.floor((maxSide - 2 * gap) / modules));
      let markerPx = modulePx * modules;
      if (markerPx > maxSide) {
        modulePx = Math.max(1, Math.floor(maxSide / modules));
        markerPx = modulePx * modules;
      }
      return { count, density, size, width, height, grey, bg, dictName, info, cols, rows, cellW, cellH, originX, originY, bits, modules, modulePx, markerPx };
    }

    function draw() {
      els.err.textContent = "";
      let opt;
      try { opt = layout(); }
      catch (e) {
        els.err.textContent = e.message;
        els.download.disabled = true;
        return;
      }
      els.download.disabled = false;
      els.swatch.style.background = `rgb(${opt.grey}, ${opt.grey}, ${opt.grey})`;
      els.captionSize.textContent = `${opt.width} × ${opt.height}`;
      const area = opt.size.widthM != null
        ? `${opt.size.widthM.toFixed(2)}×${opt.size.heightM.toFixed(2)} m`
        : "size in px";
      const countLine = opt.density != null
        ? `<strong>${opt.count}</strong> markers · ${opt.density} / m²`
        : `<strong>${opt.count}</strong> ${opt.dictName} markers`;
      const wallLine = opt.size.panel
        ? `${opt.size.panel.model} · ${opt.size.ledCols}×${opt.size.ledRows} cabinets<br>`
        : "";
      els.stats.innerHTML =
        `${countLine}<br>` +
        wallLine +
        `canvas <strong>${opt.width}×${opt.height}</strong> · ${area}<br>` +
        `grid <strong>${opt.cols}×${opt.rows}</strong> · marker ${opt.markerPx}px`;
      els.download.textContent = fileFmt === "jpg" ? "Download JPG" : "Download PNG";

      const canvas = els.sheet;
      canvas.width = opt.width;
      canvas.height = opt.height;
      canvas.style.background = opt.bg;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = opt.bg;
      ctx.fillRect(0, 0, opt.width, opt.height);
      ctx.fillStyle = `rgb(${opt.grey},${opt.grey},${opt.grey})`;

      const dict = DICTS[opt.dictName];
      const lastRowCount = opt.count - (opt.rows - 1) * opt.cols;
      for (let id = 0; id < opt.count; id++) {
        const row = Math.floor(id / opt.cols);
        const col = id % opt.cols;
        const rowCount = row === opt.rows - 1 ? lastRowCount : opt.cols;
        const rowPadX = Math.floor((opt.cols - rowCount) * opt.cellW / 2);
        const x0 = opt.originX + rowPadX + col * opt.cellW + Math.floor((opt.cellW - opt.markerPx) / 2);
        const y0 = opt.originY + row * opt.cellH + Math.floor((opt.cellH - opt.markerPx) / 2);
        const inner = unpackBits(dict, id, opt.bits, opt.info.nbytes);
        for (let my = 0; my < opt.modules; my++) {
          for (let mx = 0; mx < opt.modules; mx++) {
            const iy = my - 1, ix = mx - 1;
            const on = iy >= 0 && iy < opt.bits && ix >= 0 && ix < opt.bits && inner[iy][ix];
            if (!on) continue;
            ctx.fillRect(x0 + mx * opt.modulePx, y0 + my * opt.modulePx, opt.modulePx, opt.modulePx);
          }
        }
      }
    }

    function setBg(hex) {
      const v = parseHex(hex);
      els.bg.value = v;
      els.bgHex.value = v;
      draw();
    }

    function syncGrey(from) {
      const v = Math.max(0, Math.min(255, Math.round(num(from, 128))));
      els.grey.value = v;
      els.greyNum.value = v;
      draw();
    }

    ["count", "density", "width", "height", "pitch", "panel", "ledCols", "ledRows", "dict"].forEach(id => {
      if (!els[id]) return;
      els[id].addEventListener("input", draw);
      els[id].addEventListener("change", draw);
    });
    els.countMode.addEventListener("click", e => {
      const btn = e.target.closest("button[data-count-mode]");
      if (!btn) return;
      countMode = btn.dataset.countMode;
      els.countMode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
      syncModes();
      draw();
    });
    els.sizeMode.addEventListener("click", e => {
      const btn = e.target.closest("button[data-size-mode]");
      if (!btn) return;
      sizeMode = btn.dataset.sizeMode;
      els.sizeMode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
      syncModes();
      draw();
    });
    els.panelFilter.addEventListener("input", () => {
      const q = els.panelFilter.value.trim().toLowerCase();
      for (const opt of els.panel.querySelectorAll("option")) {
        opt.hidden = q.length > 0 && !opt.textContent.toLowerCase().includes(q);
      }
    });
    els.grey.addEventListener("input", () => syncGrey(els.grey));
    els.greyNum.addEventListener("input", () => syncGrey(els.greyNum));
    els.bg.addEventListener("input", () => setBg(els.bg.value));
    els.bgHex.addEventListener("change", () => {
      try { setBg(els.bgHex.value); }
      catch (e) { els.err.textContent = e.message; }
    });
    els.bgReset.addEventListener("click", () => setBg("#000000"));
    els.fmt.addEventListener("click", e => {
      const btn = e.target.closest("button[data-fmt]");
      if (!btn) return;
      fileFmt = btn.dataset.fmt;
      els.fmt.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
      els.download.textContent = fileFmt === "jpg" ? "Download JPG" : "Download PNG";
    });
    els.download.addEventListener("click", () => {
      try {
        const opt = layout();
        const ext = fileFmt === "jpg" ? "jpg" : "png";
        downloadCanvas(els.sheet, `aruco_${opt.count}_${opt.width}x${opt.height}.${ext}`, ext);
      } catch (e) {
        els.err.textContent = e.message;
      }
    });

    function downloadCanvas(canvas, filename, ext) {
      const mime = ext === "jpg" ? "image/jpeg" : "image/png";
      const quality = ext === "jpg" ? 0.92 : undefined;
      if (canvas.toBlob) {
        canvas.toBlob(blob => {
          if (!blob) { fallbackDownload(canvas, filename, mime); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, mime, quality);
        return;
      }
      fallbackDownload(canvas, filename, mime);
    }

    function fallbackDownload(canvas, filename, mime) {
      const a = document.createElement("a");
      a.href = canvas.toDataURL(mime, mime === "image/jpeg" ? 0.92 : undefined);
      a.download = filename;
      a.click();
    }

    fillPanelSelect();
    syncModes();
    draw();
  </script>
</body>
</html>
